name: Decode deck PDF
on:
  push:
    paths: ['Gorgona-One-Pitch-Deck.pdf.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d Gorgona-One-Pitch-Deck.pdf.b64 > Gorgona-One-Pitch-Deck.pdf
          git rm -q Gorgona-One-Pitch-Deck.pdf.b64
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Gorgona-One-Pitch-Deck.pdf
          git commit -m "Add investor pitch deck PDF (Miami Elio + GORGONA)"
          git push
